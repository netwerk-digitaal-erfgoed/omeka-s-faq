<VirtualHost *:80>
DocumentRoot /var/www/html

<Directory /var/www/html>
	Options -Indexes
	AllowOverride all
</Directory>

# phpMyFAQ writes its navigation links relative (./contact.html) and resolves
# them with <base href>. Crawlers that ignore <base> request them below the
# current page, e.g. /content/3/51/sitemap/A/overview.html, and phpMyFAQ’s
# unanchored rewrite rules in .htaccess serve those too, so every page nests
# one level deeper: an endless URL space. Refuse those URLs before .htaccess
# serves them; browsers, which honour <base>, never request them.
<IfModule mod_rewrite.c>
	RewriteEngine On
	# A top-level page anywhere but the root.
	RewriteRule ^/.+/(show-categories|search|addcontent|ask|open-questions|help|contact|glossary|overview|login|privacy|index)\.html?$ - [R=404,NC,L]
	# A route below another route.
	RewriteRule ^/(content|category|news|sitemap|tags)/(.+/)?(content|category|news|sitemap|tags)/ - [R=404,NC,L]
</IfModule>
</VirtualHost>
