# Bound memory use: each worker can take up to PHP’s memory_limit (64M), and the
# default of 150 workers far exceeds the container’s memory limit. Requests
# beyond this queue instead of getting the container OOM-killed.
<IfModule mpm_prefork_module>
	MaxRequestWorkers 12
	# Recycle workers, so memory they keep after a request is returned.
	MaxConnectionsPerChild 500
</IfModule>
